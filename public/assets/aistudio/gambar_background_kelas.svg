<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="65%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="15%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="windowSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>
    <linearGradient id="sunBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Classroom Upper Wall -->
  <rect width="1600" height="640" fill="url(#wallGrad)" />

  <!-- Wall Moldings & Baseboard -->
  <rect y="20" width="1600" height="12" fill="#d97706" opacity="0.6" />
  <rect y="620" width="1600" height="20" fill="#78350f" />

  <!-- Sun Rays streaming from Window -->
  <polygon points="120,80 340,80 620,900 0,900" fill="url(#sunBeam)" />

  <!-- Left Classroom Window -->
  <g filter="url(#shadow)">
    <!-- Window Frame Outer -->
    <rect x="80" y="80" width="260" height="360" rx="16" fill="#78350f" stroke="#451a03" stroke-width="6" />
    <!-- Sky & Scenery Inside Window -->
    <rect x="96" y="96" width="228" height="328" rx="8" fill="url(#windowSky)" />
    <!-- Distant hills and tree tops -->
    <circle cx="160" cy="400" r="90" fill="#22c55e" opacity="0.9" />
    <circle cx="260" cy="410" r="80" fill="#16a34a" opacity="0.9" />
    <!-- Window Glass Bars -->
    <line x1="210" y1="96" x2="210" y2="424" stroke="#ffffff" stroke-width="8" />
    <line x1="96" y1="260" x2="324" y2="260" stroke="#ffffff" stroke-width="8" />
    <!-- Window Sill with cute potted plant -->
    <rect x="60" y="440" width="300" height="20" rx="6" fill="#92400e" stroke="#451a03" stroke-width="4" />
    <path d="M190 440 L230 440 L220 400 L200 400 Z" fill="#ea580c" />
    <circle cx="210" cy="385" r="22" fill="#15803d" />
    <circle cx="195" cy="390" r="15" fill="#16a34a" />
    <circle cx="225" cy="390" r="15" fill="#22c55e" />
  </g>

  <!-- Big Central Chalkboard (Papan Hitam Utama Kelas) -->
  <g filter="url(#shadow)">
    <!-- Wooden Outer Board Frame -->
    <rect x="420" y="60" width="760" height="420" rx="20" fill="#92400e" stroke="#582f0e" stroke-width="12" />
    <!-- Green Chalkboard Surface -->
    <rect x="440" y="80" width="720" height="380" rx="10" fill="url(#boardGrad)" />
    <!-- Chalk Tray -->
    <rect x="410" y="480" width="780" height="18" rx="6" fill="#78350f" />
    <rect x="520" y="474" width="30" height="6" rx="2" fill="#ffffff" />
    <rect x="560" y="474" width="28" height="6" rx="2" fill="#fde047" />
    <rect x="600" y="474" width="50" height="8" rx="2" fill="#fed7aa" stroke="#78350f" stroke-width="1" />

    <!-- Blackboard Decorative Educational Title & Icons -->
    <text x="800" y="140" fill="#fef08a" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-weight="900" font-size="34" text-anchor="middle" letter-spacing="3">
      KELAS BAHASA MELAYU TAHUN 5 BESTARI
    </text>
    <line x1="530" y1="155" x2="1070" y2="155" stroke="#fef08a" stroke-width="3" stroke-dasharray="10,6" />

    <!-- Chalkboard Cute Doodles -->
    <text x="800" y="200" fill="#ffffff" opacity="0.9" font-family="sans-serif" font-weight="bold" font-size="22" text-anchor="middle">
      “Ayat Perintah: Suruhan · Larangan · Silaan · Permintaan”
    </text>

    <!-- Chalkboard Little Motifs -->
    <g transform="translate(480, 240)">
      <rect width="120" height="150" rx="10" fill="#ffffff" opacity="0.15" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,4" />
      <text x="60" y="40" fill="#a7f3d0" font-weight="bold" font-size="16" text-anchor="middle">1. Suruhan</text>
      <text x="60" y="85" fill="#fef3c7" font-size="13" text-anchor="middle">Buat latihan</text>
      <text x="60" y="115" fill="#fef3c7" font-size="13" text-anchor="middle">Tulis nota</text>
    </g>

    <g transform="translate(640, 240)">
      <rect width="120" height="150" rx="10" fill="#ffffff" opacity="0.15" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,4" />
      <text x="60" y="40" fill="#fca5a5" font-weight="bold" font-size="16" text-anchor="middle">2. Larangan</text>
      <text x="60" y="85" fill="#fef3c7" font-size="13" text-anchor="middle">Jangan bising</text>
      <text x="60" y="115" fill="#fef3c7" font-size="13" text-anchor="middle">Usah risau</text>
    </g>

    <g transform="translate(800, 240)">
      <rect width="120" height="150" rx="10" fill="#ffffff" opacity="0.15" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,4" />
      <text x="60" y="40" fill="#fed7aa" font-weight="bold" font-size="16" text-anchor="middle">3. Silaan</text>
      <text x="60" y="85" fill="#fef3c7" font-size="13" text-anchor="middle">Sila masuk</text>
      <text x="60" y="115" fill="#fef3c7" font-size="13" text-anchor="middle">Jemput duduk</text>
    </g>

    <g transform="translate(960, 240)">
      <rect width="120" height="150" rx="10" fill="#ffffff" opacity="0.15" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,4" />
      <text x="60" y="40" fill="#93c5fd" font-weight="bold" font-size="16" text-anchor="middle">4. Permintaan</text>
      <text x="60" y="85" fill="#fef3c7" font-size="13" text-anchor="middle">Tolong senyap</text>
      <text x="60" y="115" fill="#fef3c7" font-size="13" text-anchor="middle">Harap maklum</text>
    </g>
  </g>

  <!-- Wall Clock Above Blackboard -->
  <g filter="url(#shadow)">
    <circle cx="800" cy="30" r="26" fill="#ffffff" stroke="#78350f" stroke-width="6" />
    <circle cx="800" cy="30" r="3" fill="#dc2626" />
    <line x1="800" y1="30" x2="800" y2="15" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <line x1="800" y1="30" x2="812" y2="30" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Right Bulletin Board (Papan Kenyataan dengan Lukisan & Bintang Murid) -->
  <g filter="url(#shadow)">
    <rect x="1260" y="80" width="260" height="360" rx="16" fill="#d97706" stroke="#92400e" stroke-width="8" />
    <rect x="1275" y="95" width="230" height="330" rx="8" fill="#fef3c7" />

    <!-- Bulletin Header Pin -->
    <circle cx="1390" cy="115" r="8" fill="#ef4444" />

    <!-- Pinned Star Work Sheets -->
    <rect x="1295" y="135" width="95" height="120" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" transform="rotate(-3 1295 135)" />
    <circle cx="1340" cy="145" r="4" fill="#3b82f6" />
    <text x="1342" y="175" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">KSSR Semakan</text>
    <text x="1342" y="200" fill="#f59e0b" font-size="22" text-anchor="middle">⭐ 100</text>
    <text x="1342" y="230" fill="#15803d" font-size="10" font-weight="bold" text-anchor="middle">Hebat & Pintar</text>

    <rect x="1405" y="145" width="90" height="115" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" transform="rotate(4 1405 145)" />
    <circle cx="1450" cy="155" r="4" fill="#10b981" />
    <text x="1450" y="185" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">Ayat Perintah</text>
    <text x="1450" y="215" fill="#6366f1" font-size="18" text-anchor="middle">📚 A+</text>

    <!-- Pinned Motivational Poster at bottom -->
    <rect x="1305" y="280" width="170" height="120" rx="10" fill="#fed7aa" stroke="#f97316" stroke-width="2" />
    <text x="1390" y="315" fill="#7c2d12" font-weight="bold" font-size="13" text-anchor="middle">JADUAL HARIAN</text>
    <text x="1390" y="340" fill="#9a3412" font-size="11" text-anchor="middle">Bahasa Melayu</text>
    <text x="1390" y="365" fill="#9a3412" font-size="11" text-anchor="middle">Aktiviti Gamifikasi</text>
    <text x="1390" y="388" fill="#15803d" font-weight="bold" font-size="11" text-anchor="middle">Modul AR Aktif</text>
  </g>

  <!-- Wooden Floor (Lantai Kayu Sekolah) -->
  <rect y="640" width="1600" height="260" fill="url(#floorGrad)" />
  <!-- Wooden Plank Lines with perspective -->
  <line x1="0" y1="640" x2="1600" y2="640" stroke="#582f0e" stroke-width="4" />
  <line x1="0" y1="710" x2="1600" y2="710" stroke="#451a03" stroke-width="3" opacity="0.6" />
  <line x1="0" y1="790" x2="1600" y2="790" stroke="#451a03" stroke-width="3" opacity="0.6" />
  <line x1="0" y1="875" x2="1600" y2="875" stroke="#451a03" stroke-width="3" opacity="0.6" />

  <!-- Vertical Wood Planks -->
  <line x1="200" y1="640" x2="140" y2="710" stroke="#451a03" stroke-width="2" opacity="0.5" />
  <line x1="450" y1="640" x2="420" y2="710" stroke="#451a03" stroke-width="2" opacity="0.5" />
  <line x1="750" y1="640" x2="740" y2="710" stroke="#451a03" stroke-width="2" opacity="0.5" />
  <line x1="1050" y1="640" x2="1060" y2="710" stroke="#451a03" stroke-width="2" opacity="0.5" />
  <line x1="1350" y1="640" x2="1380" y2="710" stroke="#451a03" stroke-width="2" opacity="0.5" />

  <line x1="320" y1="710" x2="280" y2="790" stroke="#451a03" stroke-width="2" opacity="0.5" />
  <line x1="620" y1="710" x2="600" y2="790" stroke="#451a03" stroke-width="2" opacity="0.5" />
  <line x1="920" y1="710" x2="930" y2="790" stroke="#451a03" stroke-width="2" opacity="0.5" />
  <line x1="1220" y1="710" x2="1250" y2="790" stroke="#451a03" stroke-width="2" opacity="0.5" />
  <line x1="1520" y1="710" x2="1570" y2="790" stroke="#451a03" stroke-width="2" opacity="0.5" />

  <!-- Teacher's Podium / Desk on Bottom Left corner -->
  <g filter="url(#shadow)">
    <path d="M40 760 L180 760 L200 870 L20 870 Z" fill="#b45309" stroke="#78350f" stroke-width="6" />
    <rect x="30" y="740" width="160" height="25" rx="6" fill="#d97706" stroke="#92400e" stroke-width="4" />
    <!-- Stack of Colorful Books on Desk -->
    <rect x="50" y="718" width="55" height="12" rx="3" fill="#ef4444" stroke="#991b1b" stroke-width="2" />
    <rect x="55" y="704" width="50" height="12" rx="3" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2" />
    <rect x="52" y="690" width="52" height="12" rx="3" fill="#10b981" stroke="#047857" stroke-width="2" />
    <rect x="120" y="708" width="24" height="30" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    <!-- Pencils in holder -->
    <line x1="126" y1="708" x2="124" y2="690" stroke="#dc2626" stroke-width="4" stroke-linecap="round" />
    <line x1="134" y1="708" x2="136" y2="685" stroke="#2563eb" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Cute School Mascot Owl on Corner -->
  <g transform="translate(1500, 30)">
    <circle cx="20" cy="20" r="16" fill="#f59e0b" />
    <circle cx="15" cy="18" r="5" fill="#ffffff" />
    <circle cx="25" cy="18" r="5" fill="#ffffff" />
    <circle cx="16" cy="18" r="2.5" fill="#000000" />
    <circle cx="26" cy="18" r="2.5" fill="#000000" />
    <polygon points="20,23 17,28 23,28" fill="#ea580c" />
    <!-- Graduation Cap -->
    <polygon points="20,4 0,10 20,16 40,10" fill="#1e293b" />
    <line x1="38" y1="10" x2="38" y2="20" stroke="#fbbf24" stroke-width="2" />
  </g>
</svg>
